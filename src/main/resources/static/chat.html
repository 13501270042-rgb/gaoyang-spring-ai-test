<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #075e54; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #dcf8c6; color: #333; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
        .msg.ai.loading::after { content: '\25CD'; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .input-bar { display: flex; gap: 8px; padding: 12px 16px; background: #f0f0f0; border-top: 1px solid #ddd; align-items: center; }
        .input-bar input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
        .input-bar input[type="text"]:focus { border-color: #075e54; }
        .input-bar input.session { flex: 0 0 140px; font-size: 13px; }
        .input-bar button { padding: 10px 20px; background: #075e54; color: #fff; border: none; border-radius: 20px; font-size: 15px; cursor: pointer; }
        .input-bar button:hover { background: #064e44; }
        .input-bar button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="header">Chat Test</div>
<div class="chat-area" id="chatArea"></div>
<div class="input-bar">
    <input type="text" class="session" id="sessionId" value="session001" placeholder="Session ID">
    <input type="text" id="msgInput" placeholder="Enter message..." autocomplete="off">
    <button id="sendBtn" onclick="send()">Send</button>
</div>
<script>
    const BASE_URL = 'http://localhost:8080';
    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sessionId = document.getElementById('sessionId');
    const sendBtn = document.getElementById('sendBtn');

    msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function appendMsg(text, role) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    async function send() {
        const msg = msgInput.value.trim();
        if (!msg) return;
        appendMsg(msg, 'user');
        msgInput.value = '';
        sendBtn.disabled = true;
        const aiDiv = appendMsg('', 'ai');
        aiDiv.classList.add('loading');
        try {
            const url = BASE_URL + '/hello?msg=' + encodeURIComponent(msg) + '&sessionId=' + encodeURIComponent(sessionId.value);
            const resp = await fetch(url);
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let full = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                full += chunk;
                aiDiv.textContent = full;
                chatArea.scrollTop = chatArea.scrollHeight;
            }
            if (!full) aiDiv.textContent = '(No response)';
        } catch (e) {
            aiDiv.textContent = 'Request failed: ' + e.message;
        } finally {
            aiDiv.classList.remove('loading');
            sendBtn.disabled = false;
            msgInput.focus();
        }
    }
</script>
</body>
</html>
