<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #075e54; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #dcf8c6; color: #333; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.1); white-space: normal; }
        .msg.ai.loading::after { content: '\25CD'; animation: blink 1s infinite; }
        .msg.ai p { margin: 0 0 8px 0; }
        .msg.ai p:last-child { margin-bottom: 0; }
        .msg.ai pre { background: #f6f8fa; border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
        .msg.ai code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 13px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
        .msg.ai pre code { background: none; padding: 0; }
        .msg.ai ul, .msg.ai ol { margin: 4px 0; padding-left: 20px; }
        .msg.ai li { margin: 2px 0; }
        .msg.ai blockquote { border-left: 3px solid #075e54; margin: 8px 0; padding: 4px 12px; color: #666; background: #f9f9f9; border-radius: 0 6px 6px 0; }
        .msg.ai h1, .msg.ai h2, .msg.ai h3, .msg.ai h4 { margin: 8px 0 4px 0; font-weight: 600; }
        .msg.ai h1 { font-size: 1.3em; } .msg.ai h2 { font-size: 1.15em; } .msg.ai h3 { font-size: 1.05em; }
        .msg.ai a { color: #075e54; text-decoration: underline; }
        .msg.ai table { border-collapse: collapse; margin: 8px 0; }
        .msg.ai th, .msg.ai td { border: 1px solid #ddd; padding: 4px 8px; }
        .msg.ai th { background: #f6f8fa; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .input-bar { display: flex; gap: 8px; padding: 12px 16px; background: #f0f0f0; border-top: 1px solid #ddd; align-items: center; }
        .input-bar input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
        .input-bar input[type="text"]:focus { border-color: #075e54; }
        .input-bar input.session { flex: 0 0 140px; font-size: 13px; }
        .input-bar button { padding: 10px 20px; background: #075e54; color: #fff; border: none; border-radius: 20px; font-size: 15px; cursor: pointer; }
        .input-bar button:hover { background: #064e44; }
        .input-bar button:disabled { background: #aaa; cursor: not-allowed; }
</style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="header">Chat Test</div>
<div class="chat-area" id="chatArea"></div>
<div class="input-bar">
    <input type="text" class="session" id="sessionId" value="session001" placeholder="Session ID">
    <input type="text" id="msgInput" placeholder="Enter message..." autocomplete="off">
    <button id="sendBtn" onclick="send()">Send</button>
</div>
<script>
    const BASE_URL = 'http://localhost:8080';
    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sessionId = document.getElementById('sessionId');
    const sendBtn = document.getElementById('sendBtn');

    msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function appendMsg(text, role) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    async function send() {
        const msg = msgInput.value.trim();
        if (!msg) return;
        appendMsg(msg, 'user');
        msgInput.value = '';
        sendBtn.disabled = true;
        const aiDiv = appendMsg('', 'ai');
        aiDiv.classList.add('loading');
        try {
            const url = BASE_URL + '/origin/hello?msg=' + encodeURIComponent(msg) + '&sessionId=' + encodeURIComponent(sessionId.value);
            const resp = await fetch(url);
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let full = '';
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        full += line.slice(5);
                    }
                }
                aiDiv.innerHTML = marked.parse(full);
                chatArea.scrollTop = chatArea.scrollHeight;
            }
            if (buffer.startsWith('data:')) {
                full += buffer.slice(5);
            }
            aiDiv.innerHTML = marked.parse(full || '(No response)');
        } catch (e) {
            aiDiv.innerHTML = 'Request failed: ' + e.message;
        } finally {
            aiDiv.classList.remove('loading');
            sendBtn.disabled = false;
            msgInput.focus();
        }
    }
</script>
</body>
</html>
