spring:
  application:
    name: gaoyang-spring-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  ai:
    # 显式声明当前生效的模型提供方,保持原有 Ollama 行为不变。
    # ollama 与 dashscope 两个 starter 的 spring.ai.model.* 条件均为 matchIfMissing=true,
    # 不声明会同时注册 ChatModel/EmbeddingModel 导致注入歧义,故必须显式指定。
    # 切换百炼:把下面两项改成 dashscope,并打开 dashscope 配置(注意 embedding 维度需与
    # spring.data.vectorstore.pgvector.dimensions 一致)。
    model:
      chat: ollama
      embedding: ollama
    # dashscope:
    #   api-key: ${DASHSCOPE_API_KEY}
    #   chat:
    #     options:
    #       model: qwen-plus
    #   embedding:
    #     options:
    #       model: text-embedding-v3
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.7
        num-predict: 1024
      embedding:
        model: nomic-embed-text
      init:
        timeout: 1m
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    vectorstore:
      pgvector:
        initialize-schema: always
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  #mapper xml位置,默认即classpath*:/mapper/**/*.xml,此处显式声明
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

searxng:
  base-url: http://localhost:8888

logging:
  level:
    # SimpleLoggerAdvisorDEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
    # OpenAI/HTTP
    org.springframework.ai.openai: DEBUG
    org.springframework.ai.ollama: DEBUG