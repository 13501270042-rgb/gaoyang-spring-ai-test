spring:
  application:
    name: gaoyang-spring-ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.7
        num-predict: 1024
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    # 开启SimpleLoggerAdvisor的DEBUG日志
    org.springframework.ai.chat.client.advisor: DEBUG
    # 可选：打印底层http原始请求报文（OpenAI/兼容接口）
    org.springframework.ai.openai: DEBUG
    org.springframework.ai.ollama: DEBUG
