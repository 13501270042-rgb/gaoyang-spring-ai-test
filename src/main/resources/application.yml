spring:
  application:
    name: gaoyang-spring-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  ai:
    mcp:
      server:
        name: gaoyang-mcp-server
        version: 1.0.0
        # SSE 连接端点（客户端 GET 建立长连接），默认 /sse
        sse-endpoint: /sse
        # 消息端点（客户端 POST 发送工具调用），默认 /mcp/message
        sse-message-endpoint: /mcp/messages
      client:
        enabled: true
        name: gaoyang-mcp-client
        version: 1.0.0
        type: SYNC
        toolcallback:
          # 禁用自动注册，McpClientConfig 中已手动创建以连接名为 Bean 名的 McpSyncClient
          enabled: false
        # SSE 连接已改为 McpClientConfig 中手动创建，支持 @Qualifier("连接名") 精确注入
        # sse:
        #   connections:
        #     gaoyang-local:
        #       url: http://localhost:8080/sse
        #       headers:
        #         Authorization: Bearer 123
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b
        temperature: 0.7
        num-predict: 1024
      embedding:
        model: nomic-embed-text
      init:
        timeout: 1m
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    vectorstore:
      pgvector:
        initialize-schema: always
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mybatis-plus:
  #mapper xml位置,默认即classpath*:/mapper/**/*.xml,此处显式声明
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mcp:
  auth:
    # MCP Server 凭证，客户端需携带 Authorization: Bearer <token> 访问
    token: 123

searxng:
  base-url: http://localhost:8888

logging:
  level:
    # SimpleLoggerAdvisorDEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
    # OpenAI/HTTP
    org.springframework.ai.openai: DEBUG
    org.springframework.ai.ollama: DEBUG